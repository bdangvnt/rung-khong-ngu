<!DOCTYPE html>
<!--
  Bản sao template web-mobile gốc của Cocos 3.8.8, sửa đúng phần <head>.

  VÌ SAO PHẢI CHÉP CẢ FILE: Cocos không cho ghi đè lẻ một dòng — `build-templates/<platform>/`
  thay THẲNG file cùng tên trong template gốc. Nên nâng cấp Cocos lên bản mới thì phải so
  lại file này với bản gốc ở:
      <Cocos>/Contents/Resources/resources/3d/engine/templates/web-mobile/index.ejs

  BA CHỖ ĐÃ SỬA, phần còn lại giữ nguyên từng ký tự:
  1. <title> — bỏ "Cocos Creator | first-demo". Đó là tên THƯ MỤC PROJECT, không phải tên
     game; ai mở link cũng thấy nó ở tab và ở màn hình chia sẻ.
  2. Thêm <meta name="description"> + thẻ og: — dán link vào Zalo/Messenger thì hiện tên và
     một câu giới thiệu, thay vì một dòng URL trơ.
  3. <html lang="vi">.

  TÊN GAME Ở ĐÂY LÀ TÊN BẢN TOÀN CẦU, vì đó là vùng mặc định khi mở lần đầu
  (`Region.DEFAULT_REGION`). Đổi sang vùng khác thì `RegionPalette.applyTitle` sửa lại
  `document.title` lúc chạy — nhưng thẻ tĩnh này mới là thứ trình thu thập link đọc được,
  nên nó phải khớp với vùng mặc định.
-->
<html lang="vi">
<head>
  <meta charset="utf-8">

  <title>Rừng Không Ngủ</title>
  <meta name="description"
        content="Ba trăm năm trước một thành phố chôn tội của mình vào rừng. Rừng không tiêu hoá được."/>
  <meta property="og:title" content="Rừng Không Ngủ"/>
  <meta property="og:description"
        content="Ba trăm năm trước một thành phố chôn tội của mình vào rừng. Rừng không tiêu hoá được."/>
  <meta property="og:type" content="website"/>

  <!--http://www.html5rocks.com/en/mobile/mobifying/-->
  <meta name="viewport"
        content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1,minimal-ui=true"/>

  <!--https://developer.apple.com/library/safari/documentation/AppleApplications/Reference/SafariHTMLRef/Articles/MetaTags.html-->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">

  <!-- force webkit on 360 -->
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <!-- force edge on IE -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <meta name="msapplication-tap-highlight" content="no">

  <!-- force full screen on some browser -->
  <meta name="full-screen" content="yes"/>
  <meta name="x5-fullscreen" content="true"/>
  <meta name="360-fullscreen" content="true"/>

  <!--fix fireball/issues/3568 -->
  <!--<meta name="browsermode" content="application">-->
  <meta name="x5-page-mode" content="app">

  <!--<link rel="apple-touch-icon" href=".png" />-->
  <!--<link rel="apple-touch-icon-precomposed" href=".png" />-->

  <link rel="stylesheet" type="text/css" href="style.css"/>

</head>
<body>
  <div id="GameDiv" cc_exact_fit_screen="true">
      <div id="Cocos3dGameContainer">
        <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="99"></canvas>
      </div>
    </div>
  

<!-- Polyfills bundle. -->

<script src="src/polyfills.bundle.js" charset="utf-8"> </script>


<!-- SystemJS support. -->
<script src="src/system.bundle.js" charset="utf-8"> </script>

<!-- Import map -->
<script src="src/import-map.json" type="systemjs-importmap" charset="utf-8"> </script>

<script>
    System.import('./index.js').catch(function(err) { console.error(err); })
</script>

</body>
</html>
